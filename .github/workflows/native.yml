name: CI native
# v9.7.4 : actions en Node 24 (checkout v7, setup-node v7, setup-dotnet v6, upload-artifact v7) — supprime l'avertissement de dépréciation Node 20

# Phase 0 du protocole MIGRATION-WINUI.md : le socle WinUI 3 se build en CI,
# séparé du job Electron (ci.yml, inchangé). Déclenché quand native/ ou ce
# workflow changent. Acceptation : tests du pont verts (BUNDLES ELECTRON
# CONSTRUITS ICI — les 8 tests d'intégration exigent aven-engine-host.mjs et
# aven-pty-host.mjs, contrairement au MSIX qui n'en a pas besoin) + fenêtre
# vide buildée + MSIX téléchargeable en artefact.
on:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/native.yml"]

jobs:
  native:
    name: Socle WinUI (tests + build + MSIX)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native # global.json (épinglage SDK) s'applique
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22 (bundles Electron exigés par les tests d'intégration)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installation racine (Electron, CLI OpenCode, esbuild)
        run: npm install

      - name: Bundles Electron (aven-engine-host.mjs + aven-pty-host.mjs)
        run: npm run build:electron

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Tests du pont (xUnit)
        run: dotnet test tests/Aven.Tests/Aven.Tests.csproj -c Release

      - name: Build coquille WinUI + génération du MSIX (Release/x64)
        run: >
          dotnet build src/Aven.Native/Aven.Native.csproj -c Release
          -p:Platform=x64
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:AppxBundle=Never
          -p:AppxPackageDir=${{ github.workspace }}\AppPackages\

      - name: Upload artefact MSIX
        uses: actions/upload-artifact@v7
        with:
          name: Aven.Native-msix
          path: AppPackages/**/*.msix
          if-no-files-found: error

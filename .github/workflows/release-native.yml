# Release native (phase 7 de MIGRATION-WINUI.md) : MSIX + zip portable pour les
# trois architectures, en artefacts de release. La signature utilise un PFX encodé
# en base64 dans les secrets (AVEN_PFX_B64 + AVEN_PFX_PASSWORD) — sans secret, le
# paquet part NON SIGNÉ (signing enabled=false) : la release reste publiable et
# l'entreprise peut signer a posteriori.
name: release-native

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version publiée (ex: 10.0.1) — tag reproductible"
        required: false
        default: ""

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, ARM64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies + build Electron bundles
        run: |
          npm ci
          npm run build:electron

      - name: Decode signing certificate (optional)
        id: cert
        shell: pwsh
        run: |
          if ($env:AVEN_PFX_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP "aven-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:AVEN_PFX_B64))
            $pwd = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:AVEN_PFX_PASSWORD)
            "thumbprint=$($pwd.Thumbprint)" >> $env:GITHUB_OUTPUT
            "pfx=$pfx" >> $env:GITHUB_OUTPUT
            "signed=true" >> $env:GITHUB_OUTPUT
          } else {
            "signed=false" >> $env:GITHUB_OUTPUT
          }
        env:
          AVEN_PFX_B64: ${{ secrets.AVEN_PFX_B64 }}
          AVEN_PFX_PASSWORD: ${{ secrets.AVEN_PFX_PASSWORD }}

      - name: Build + package (${{ matrix.arch }})
        shell: pwsh
        run: |
          $args = @("build", "native/src/Aven.Native/Aven.Native.csproj", "-c", "Release",
            "-p:Platform=${{ matrix.arch }}", "-p:RuntimeIdentifier=win-${{ matrix.arch }}", "--nologo",
            "-p:GenerateAppxPackageOnBuild=true", "-p:UapAppxPackageBuildMode=SideloadOnly",
            "-p:AppxBundle=Never", "-p:AppxPackageDir=native/.out/${{ matrix.arch }}/")
          if ("${{ steps.cert.outputs.signed }}" -eq "true") {
            $args += @("-p:AppxPackageSigningEnabled=true", "-p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}",
              "-p:PackageCertificateKeyFile=${{ steps.cert.outputs.pfx }}", "-p:PackageCertificatePassword=${{ env.AVEN_PFX_PASSWORD }}")
          } else {
            $args += "-p:AppxPackageSigningEnabled=false"
          }
          & dotnet @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          AVEN_PFX_PASSWORD: ${{ secrets.AVEN_PFX_PASSWORD }}

      - name: Portable zip (${{ matrix.arch }})
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}".ToLowerInvariant()
          $bin = "native/src/Aven.Native/bin/$arch/Release/net8.0-windows10.0.19041.0/win-$arch"
          if (-not (Test-Path "$bin/Aven.Native.exe")) { $bin = "native/src/Aven.Native/bin/$arch/Release/net8.0-windows10.0.19041.0" }
          $portable = "native/.out/portable-$arch"
          New-Item -ItemType Directory -Path "$portable/dist-electron" -Force | Out-Null
          Copy-Item "$bin/*" $portable -Recurse -Force
          # Purge symboles de dev AVANT zip (Copy-Item -Exclude ne descend pas dans
          # les sous-dossiers ; PDB node-pty ~36 Mo par portable, inutiles au runtime).
          Get-ChildItem $portable -Recurse -Include *.pdb,*.appxrecipe | Remove-Item -Force
          Copy-Item "dist-electron/aven-engine-host.mjs" "$portable/dist-electron/"
          Copy-Item "dist-electron/aven-pty-host.mjs" "$portable/dist-electron/"
          # x86 : node-pty-win32-x86 n'existe pas -> le portable x86 embarque le paquet x64.
          $archPty = $arch; if ($archPty -eq "x86") { $archPty = "x64" }
          foreach ($pkg in @("node-pty", "node-pty-win32-$archPty")) {
            $src = "node_modules/@lydell/$pkg"
            if (Test-Path $src) {
              $dst = "$portable/node_modules/@lydell/$pkg"
              New-Item -ItemType Directory -Path (Split-Path $dst) -Force | Out-Null
              Copy-Item $src $dst -Recurse -Force
            }
          }
          # Node embarque (autonomie terminal), PAR ARCHITECTURE : le node du
          # runner est x64 - pour x86/ARM64 on telecharge l'exe officiel matchant.
          $machineAttendue = @{ "x64" = 0x8664; "x86" = 0x014c; "arm64" = 0xaa64 }[$arch]
          $nodeExe = (Get-Command node -ErrorAction SilentlyContinue).Source
          function Get-PEMachineCI([string]$p) {
            $fs = [System.IO.File]::OpenRead($p)
            try {
              $tete = New-Object byte[] 4096; [void]$fs.Read($tete, 0, 4096)
              $off = [BitConverter]::ToInt32($tete, 0x3C)
              $pe = New-Object byte[] 4096; $fs.Position = $off; [void]$fs.Read($pe, 0, 4096)
              return [BitConverter]::ToUInt16($pe, 4)
            } finally { $fs.Dispose() }
          }
          if ($nodeExe -and (Test-Path $nodeExe) -and ((Get-PEMachineCI $nodeExe) -ne $machineAttendue)) { $nodeExe = "" }
          # x86 : node-pty-win32-x86 n'existe pas (npm 404) -> fallback node x64.
          if (-not $nodeExe -and $arch -eq "x86") {
            $nodeExe = (Get-Command node -ErrorAction SilentlyContinue).Source
          }
          if (-not $nodeExe) {
            $cacheDir = "native/.out/node-cache/node-v22.14.0-win-$arch"
            $cacheExe = "$cacheDir/node.exe"
            if (Test-Path $cacheExe) { $nodeExe = $cacheExe }
            else {
              New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
              try {
                [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                $wc = New-Object System.Net.WebClient
                if ($arch -ne "arm64") { $wc.DownloadFile("https://nodejs.org/dist/v22.14.0/win-$arch/node.exe", $cacheExe) }
                else {
                  $wc.DownloadFile("https://nodejs.org/dist/v22.14.0/node-v22.14.0-win-arm64.zip", "$cacheDir/node.zip")
                  Expand-Archive -Path "$cacheDir/node.zip" -DestinationPath $cacheDir -Force
                  $extrait = Get-ChildItem $cacheDir -Recurse -Filter node.exe | Select-Object -First 1 -ExpandProperty FullName
                  Copy-Item $extrait $cacheExe -Force
                }
                $nodeExe = $cacheExe
              } catch { Write-Host "::warning::node $arch indisponible - le portable exigera Node" }
            }
          }
          if ($nodeExe -and (Test-Path $nodeExe)) {
            New-Item -ItemType Directory -Path "$portable/nodejs" -Force | Out-Null
            Copy-Item $nodeExe "$portable/nodejs/node.exe" -Force
            Write-Host "Node embarque ($arch) : $nodeExe"
          }
          $ver = (Get-Item "$bin/Aven.Native.dll").VersionInfo.ProductVersion
          if (-not $ver) { $ver = "${{ inputs.version }}" }
          Compress-Archive -Path "$portable/*" -DestinationPath "native/.out/Aven-native-$arch-$ver.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aven-native-${{ matrix.arch }}
          path: |
            native/.out/*.msix
            native/.out/Aven-native-*.zip
          if-no-files-found: error

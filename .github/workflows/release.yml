name: Release

# Une release Windows (installeur NSIS + portable) est produite à chaque tag v*.
# La release est créée en brouillon : publie-la depuis la page GitHub après vérification.
on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installation
        run: npm install
      - name: Tests
        run: npm test
      - name: Build complet
        run: npm run build
      - name: Packaging Windows (NSIS + portable)
        run: npx electron-builder --win nsis portable --publish never
      - name: Publication de la release (brouillon)
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

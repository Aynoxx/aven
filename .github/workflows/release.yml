name: Release Tauri

# Une release Windows (installeur NSIS + MSI) est produite à chaque tag v*.
# La release est créée en brouillon : publie-la depuis la page GitHub après vérification.
# v10.0.0 : remplace l'ancienne chaîne electron-builder — la chaîne est100 % Tauri.
on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Installation (télécharge le CLI OpenCode)
        run: npm install
      - name: Tests
        run: npm test
      - name: Vérification des conventions
        run: npm run verify
      - name: Packaging Windows (NSIS + MSI)
        run: npm run tauri:build
        env:
          CI: true
      - name: Publication de la release (brouillon)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installation (télécharge aussi Electron et le CLI OpenCode)
        run: npm install
      - name: Tests unitaires
        run: npm test
      - name: Typecheck electron
        run: npm run typecheck:electron
      - name: Build web (inclut tsc -b)
        run: npm run build:web
      - name: Build electron (inclut le bundle du host du moteur)
        run: npm run build:electron
      # v9.7.3 : plus de dotnet test dans ce job Linux — la suite Aven.Tests est
      # Windows-only par conception (DPAPI, EventWaitHandle nommé, RegisterHotKey,
      # ConPTY : 17 tests refusent hors Windows via Assert.True(OperatingSystem
      # .IsWindows())). Elle tourne intégralement (310/310) dans native.yml
      # (Socle WinUI, windows-latest), le runner natif dédié.
      - name: Vérification v8.8.0 + fraîcheur du build
        run: npm run verify

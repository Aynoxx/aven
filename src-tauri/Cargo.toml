[package]
name = "aven"
version = "10.0.0"
description = "Aven — espace de travail IA"
authors = ["Liam"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aven_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon"] }

[package]
name = "aven"
version = "10.0.0"
description = "Aven — espace de travail IA"
authors = ["Liam"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "aven_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
serde_json = "1.0"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="vendor/xterm.css" />
<style>
  /* Hôte de l'émulateur : plein, transparent, sans scroll HTML (le viewport xterm
     défile en interne, parité .bridge-term-host du web). */
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
  #host { position: absolute; inset: 6px; }
  .xterm .xterm-viewport { background: transparent !important; }
</style>
</head>
<body>
<div id="host"></div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script>
"use strict";
// Emulateur VT complet (décision §5.1) : les chunks BRUTS du PTY passent par
// write(), les frappes du TUI remontent en onData, l'addon-fit donne cols/rows.
var host = document.getElementById("host");
var term = new Terminal({
  fontFamily: "Consolas, 'Cascadia Mono', monospace",
  fontSize: 13,
  cursorBlink: true,
  scrollback: 4000,
  convertEol: false,
  theme: { background: "transparent" }
});
var fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(host);
try { fit.fit(); } catch (e) {}

function post(m) { window.chrome.webview.postMessage(m); }

term.onData(function (d) { post({ type: "data", data: d }); });
term.onResize(function (dims) { post({ type: "resize", cols: dims.cols, rows: dims.rows }); });

// La fenetre WinUI change de taille : le fit suit (ResizeObserver > window.resize).
if (typeof ResizeObserver === "function") {
  new ResizeObserver(function () { try { fit.fit(); } catch (e) {} }).observe(host);
}
window.addEventListener("resize", function () { try { fit.fit(); } catch (e) {} });

window.chrome.webview.addEventListener("message", function (ev) {
  var m = ev.data || {};
  if (m.type === "write") term.write(m.data || "");
  else if (m.type === "reset") term.reset();
  else if (m.type === "theme") term.options.theme = m.theme;
  else if (m.type === "resize") { try { fit.fit(); } catch (e) {} }
});

post({ type: "ready", cols: term.cols, rows: term.rows });
</script>
</body>
</html>
